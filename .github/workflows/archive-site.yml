name: Online archive website

on:
  pull_request:
    paths: ['web/**', '.github/workflows/archive-site.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/archive-site.yml']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-website-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Test and build archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          PAGES_BASE_PATH: /AFK

  snapshot:
    name: Build encrypted Pages archive
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - run: npm ci --no-audit --no-fund
      - name: Build application without production secrets
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Read Neon and write encrypted snapshot only
        run: npm run export:pages
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist/client
          retention-days: 1

  deploy:
    name: Publish to github.io
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish encrypted archive to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
