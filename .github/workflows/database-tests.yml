name: Database compatibility

on:
  pull_request:
    paths: ['**/*.py', 'requirements.txt', '.github/workflows/database-tests.yml']
  push:
    branches: [main]
    paths: ['**/*.py', 'requirements.txt', '.github/workflows/database-tests.yml']

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: afk_test
          POSTGRES_USER: afk_test
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U afk_test -d afk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test SQLite, PostgreSQL and data migration
        env:
          TEST_DATABASE_URL: postgresql://afk_test:local-test-only@127.0.0.1:5432/afk_test?sslmode=disable
        run: python -m unittest -v test_database test_actions_database test_gallery_diagnostics test_browser_keep_open test_startup_broadcast
