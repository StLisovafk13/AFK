name: Telegram bot trial

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Время работы бота в минутах"
        type: choice
        default: "30"
        options: ["15", "30", "60", "120", "240"]

permissions:
  contents: read

concurrency:
  group: vsco-bot-trial
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BOT_WORKDIR: ${{ github.workspace }}/runtime/work
      BOT_LOGDIR: ${{ github.workspace }}/runtime/logs
      BOT_BROWSER_HEADLESS: "1"
      BOT_BROWSER_KEEP_OPEN: "0"
      BOT_STARTUP_BROADCAST_ENABLED: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          if not os.getenv("TELEGRAM_BOT_TOKEN", "").strip():
              raise SystemExit("Add TELEGRAM_BOT_TOKEN in repository Settings → Secrets and variables → Actions")
          if not os.getenv("DATABASE_URL", "").strip():
              raise SystemExit("Add DATABASE_URL from Neon in repository Actions secrets")
          PY

      - name: Install dependencies and Firefox
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps firefox
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl

      - name: Check PostgreSQL and initialize schema
        id: neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          from database import connect_database, initialize_schema
          conn = connect_database()
          try:
              initialize_schema(conn)
              print("PostgreSQL connection and schema ready")
          finally:
              conn.close()
          PY
          mkdir -p "$BOT_WORKDIR" "$BOT_LOGDIR"

      - name: Run bot for selected duration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_ADMIN_IDS: ${{ secrets.BOT_ADMIN_IDS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRIAL_MINUTES: ${{ inputs.minutes }}
        run: |
          set +e
          timeout --signal=INT --kill-after=30s "${TRIAL_MINUTES}m" python -u vsco_bot.py
          result=$?
          if [ "$result" -eq 124 ]; then
            echo "Trial duration reached; bot stopped."
            exit 0
          fi
          exit "$result"

      - name: Save troubleshooting logs
        if: ${{ always() && steps.neon.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: vsco-bot-logs
          path: |
            runtime/logs/
            logs/
          if-no-files-found: ignore
          retention-days: 7
